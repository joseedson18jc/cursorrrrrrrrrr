# Render Blueprint — deploys the FastAPI backend as one web service.
# One-click: https://render.com/deploy?repo=<this repo>
#
# The dashboard (Next.js) is hosted on Vercel and reaches this backend through
# its BACKEND_URL setting (https://shadowbroker-geoint-api.onrender.com), so
# no frontend service is defined here. Earlier versions of this file also
# created "shadowbroker-geoint-web"; Render does not delete services removed
# from a Blueprint, so delete that one by hand if it still exists.
#
# Sizing: the backend holds every flight, ship and satellite in memory.
#   * Without AIS_API_KEY (Baltic ships only): ~500 MB — fits, barely, in 512 MB.
#   * With AIS_API_KEY (global ships):        ~610 MB and growing — needs the
#     "standard" plan (2 GB). Free and starter (512 MB) will be OOM-killed.
#   Free instances also sleep after 15 minutes without traffic.
services:
  - type: web
    name: shadowbroker-geoint-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free          # change to "standard" before adding AIS_API_KEY
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LIVEUAMAP_ENABLED
        value: "0"
      # User-Agent sent to adsb.lol, Nominatim, etc. adsb.lol refuses the
      # project name and the auto-generated "operator-xxxxxx" handles, so
      # without a real handle the flights layer stays empty. Not a secret.
      - key: OPERATOR_HANDLE
        value: joseedson18jc
      # Secrets — set in the Render dashboard, never in git.
      - key: AIS_API_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: ADMIN_KEY
        generateValue: true
